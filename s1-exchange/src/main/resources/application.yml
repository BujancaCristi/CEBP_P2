# S1 - Exchange core. Owner of this file: Patric.
# Each package owner configures their own things in their own file (imported below),
# so nobody edits application.yml after Phase 0.

spring:
  application:
    name: s1-exchange
  config:
    import:
      - optional:classpath:platform.yml   # Cezar  (security, JWT, seed, outbox relay)
      - optional:classpath:ops.yml        # Paul   (bot settings, incidents)
      - optional:classpath:realtime.yml   # Paul   (STOMP / WebSocket)

  datasource:
    url: ${S1_DB_URL:jdbc:postgresql://localhost:5432/exchange}
    username: ${S1_DB_USER:exchange}
    password: ${S1_DB_PASSWORD:exchange}
    hikari:
      maximum-pool-size: ${S1_DB_POOL:20}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # Version ranges: V100-V199 Patric, V200-V299 Cezar, V300-V399 Paul

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    # Values are JSON strings (the event envelope). Each producer/consumer (de)serialises
    # explicitly with ObjectMapper, so there are no Spring type headers to agree on across services.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record

server:
  port: ${S1_PORT:8081}
  error:
    include-message: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# ---------------------------------------------------------------------------
# Trading (Patric)
# ---------------------------------------------------------------------------
exchange:
  # SAFE  = atomic conditional update (case 1), @Version check (case 2), one matcher per symbol (case 3)
  # UNSAFE = deliberately broken variants used by the concurrency tests to count violations
  concurrency-mode: ${EXCHANGE_CONCURRENCY_MODE:SAFE}
  topics:
    partitions: 3
    replication: 1
    order-commands: exchange.order-commands
    orders: exchange.orders
    trades: exchange.trades
    prices: exchange.prices
    incidents: exchange.incidents
    bots: exchange.bots
  matching:
    consumer-group: s1-matching
    # SAFE: 1 thread per partition (3). UNSAFE case 3 uses the same count but keys by orderId.
    concurrency: 3

logging:
  level:
    ro.upt.exchange: INFO
    org.apache.kafka: WARN
