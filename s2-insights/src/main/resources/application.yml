# S2 - Insights. Owner: Cristi.
spring:
  application:
    name: s2-insights
  datasource:
    url: ${S2_DB_URL:jdbc:postgresql://localhost:5433/insights}
    username: ${S2_DB_USER:insights}
    password: ${S2_DB_PASSWORD:insights}
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: s2-insights
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      # The offset is committed after the listener returns, i.e. after the projector's DB transaction commits.
      ack-mode: record
      concurrency: 3
  ai:
    openai:
      # Gemini free tier through its OpenAI-compatible endpoint; swap provider by config only.
      api-key: ${GEMINI_API_KEY:missing}
      base-url: ${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      chat:
        options:
          model: ${LLM_MODEL:gemini-2.0-flash}
          temperature: 0.2
    mcp:
      client:
        enabled: ${MCP_CLIENT_ENABLED:true}
        type: SYNC
        request-timeout: 60s
        sse:
          connections:
            mcp-server:
              url: ${MCP_URL:http://localhost:8083}

server:
  port: ${S2_PORT:8082}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

insights:
  jwt-secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
  service-api-key: ${SERVICE_API_KEY:dev-service-key}
  topics: exchange.orders,exchange.trades,exchange.prices,exchange.incidents,exchange.bots
  # Day boundary for daily stats and the 02:00 schedule
  zone: ${INSIGHTS_ZONE:Europe/Bucharest}
  agent:
    max-tool-calls: 15
    cron: "0 0 2 * * *"

logging:
  level:
    ro.upt.exchange: INFO
    org.apache.kafka: WARN
