server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=30s ipv6=off;

  location /api/s1/ {
    set $s1_upstream s1-exchange:8081;
    rewrite ^/api/s1/(.*)$ /$1 break;
    proxy_pass http://$s1_upstream;
    proxy_set_header Host $host;
  }
  location /api/s2/ {
    set $s2_upstream s2-insights:8082;
    rewrite ^/api/s2/(.*)$ /$1 break;
    proxy_pass http://$s2_upstream;
    proxy_set_header Host $host;
  }
  location /ws {
    set $realtime_upstream s1-exchange:8081;
    proxy_pass http://$realtime_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
  location / { try_files $uri $uri/ /index.html; }
}
