openapi: 3.1.0
info:
  title: S1 Exchange core - Trading
  version: 1.0.0
  description: |
    Orders, offers, order book, my orders and my trades. **Owner: Patric.**

    Joined with `platform.yaml` (Cezar) and `ops.yaml` (Paul) by `npx @redocly/cli join` for the
    Prism mock; at runtime springdoc publishes the combined spec at `/v3/api-docs`.

    ### Conventions
    * Auth: `Authorization: Bearer <JWT>` issued by `POST /api/auth/login` (platform.yaml).
    * Money and prices are decimal strings/numbers with up to 4 decimals; totals have 2 decimals.
    * Errors are RFC 9457 problem details (`application/problem+json`) with a `code` property
      (see `Problem`). Buy-from-offer conflicts add `reason` and `offer`.
    * Asynchronous writes: `POST /api/orders`, `PATCH` and `DELETE /api/orders/{id}` answer **202**
      and the change is applied by the matching engine a few milliseconds later. Watch
      `/user/queue/orders` (ops.yaml, STOMP) or poll `GET /api/orders/{id}`.
  license:
    name: Course project (UPT Distributed Systems) - internal use
    identifier: LicenseRef-Internal
servers:
  - url: http://localhost:8081
    description: S1 directly (docker compose)
  - url: /api/s1
    description: through the web-client nginx proxy
tags:
  - name: Orders
    description: Place, modify, cancel and list your orders
  - name: Offers
    description: Open SELL orders you can buy from at the price you see
  - name: Book
    description: Order book grouped by price level
  - name: Trades
    description: Executed trades
security:
  - bearerAuth: []

paths:
  /api/orders:
    post:
      tags: [Orders]
      operationId: placeOrder
      summary: Place a LIMIT or MARKET order
      description: |
        Validates, reserves cash (LIMIT BUY: `price × qty`) or shares (SELL: `qty`), saves the order
        as `PENDING`, writes `OrderPlaced` to the outbox and sends a `PlaceOrder` command to the
        matcher (key = symbol, concurrency case 3).

        A MARKET BUY reserves nothing up front: the matcher reserves each fill's exact total and
        cancels the remainder if cash runs out. MARKET orders never rest in the book
        (immediate-or-cancel).

        If the reservation fails the order is stored as `REJECTED` and returned with **422**.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrderRequest' }
            examples:
              limitBuy: { value: { symbol: ACME, side: BUY, type: LIMIT, price: 10.50, qty: 100 } }
              marketSell: { value: { symbol: ACME, side: SELL, type: MARKET, qty: 25 } }
      responses:
        '202':
          description: Accepted, status PENDING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Rejected at placement (INSUFFICIENT_FUNDS / INSUFFICIENT_SHARES). Body is the REJECTED order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }

  /api/orders/mine:
    get:
      tags: [Orders]
      operationId: myOrders
      summary: My orders, newest first
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Page of orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/orders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Orders]
      operationId: getOrder
      summary: One of my orders
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Orders]
      operationId: modifyOrder
      summary: Change price and/or quantity of an open LIMIT order
      description: |
        Queued to the matcher (`ModifyOrder`) so it is serialised with fills. The change bumps the
        order's `version`: a buyer who sends the old `seenVersion` gets **409 PRICE_CHANGED**
        (concurrency case 2). The new `qty` must exceed the filled quantity; the reservation is
        adjusted to the new `remaining × price`. The response is the order as it is *now*.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModifyOrderRequest' }
      responses:
        '202':
          description: Change queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE - order is PENDING (retry shortly) or already final
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel an order
      description: Queued to the matcher (`CancelOrder`); the unfilled reservation is released when applied.
      responses:
        '202':
          description: Cancel queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE - order already final
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/offers:
    get:
      tags: [Offers]
      operationId: listOffers
      summary: Offers (open SELL orders) of a stock, best price first
      parameters:
        - { name: symbol, in: query, required: true, schema: { type: string, maxLength: 10 }, example: ACME }
      responses:
        '200':
          description: Offers with totalPrice and version
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Offer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/offers/{orderId}/buy:
    post:
      tags: [Offers]
      operationId: buyOffer
      summary: Buy from a specific offer at the price you saw
      description: |
        Role TRADER. One conditional `UPDATE` on the offer: succeeds only if it is still open, has
        `remaining_qty ≥ qty` (**case 1**), its `version` equals `seenVersion` (**case 2**) and its
        price is `≤ maxPrice`. The trade is created and settled in the same transaction.

        On 0 rows changed the transaction is rolled back and the response is **409** with
        `reason` = `PRICE_CHANGED` (version differs - show "Price changed to X, confirm?" and retry
        with the new `seenVersion`/`maxPrice`) or `NO_LONGER_AVAILABLE` (gone, or fewer than
        `qty` shares left), plus `offer` = the current state (null if the order no longer exists).
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuyOfferRequest' }
            example: { qty: 40, maxPrice: 10.00, seenVersion: 3 }
      responses:
        '200':
          description: Trade executed and settled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuyOfferResponse' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: PRICE_CHANGED or NO_LONGER_AVAILABLE
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/OfferConflict' }
              examples:
                priceChanged:
                  value:
                    type: urn:exchange:trading:price_changed
                    title: PRICE_CHANGED
                    status: 409
                    detail: "The offer changed since you saw it: price is now 12.0000 for 100 shares (version 4)"
                    code: PRICE_CHANGED
                    reason: PRICE_CHANGED
                    offer: { orderId: 17, symbol: ACME, sellerUserId: 5, price: 12.0000, remainingQty: 100, totalPrice: 1200.00, version: 4, status: OPEN, createdTime: "2026-11-16T09:00:00Z" }
                gone:
                  value:
                    type: urn:exchange:trading:no_longer_available
                    title: NO_LONGER_AVAILABLE
                    status: 409
                    detail: "The offer is no longer available for the requested quantity (0 left)"
                    code: NO_LONGER_AVAILABLE
                    reason: NO_LONGER_AVAILABLE
                    offer: { orderId: 17, symbol: ACME, sellerUserId: 5, price: 10.0000, remainingQty: 0, totalPrice: 0.00, version: 4, status: FILLED, createdTime: "2026-11-16T09:00:00Z" }
        '422':
          description: INSUFFICIENT_FUNDS
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/stocks/{symbol}/book:
    get:
      tags: [Book]
      operationId: getBook
      summary: Order book of a stock grouped by price level
      description: Same shape as the STOMP push on `/topic/book/{symbol}` (ops.yaml).
      parameters:
        - { name: symbol, in: path, required: true, schema: { type: string } }
        - { name: depth, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: Book snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/trades/mine:
    get:
      tags: [Trades]
      operationId: myTrades
      summary: My trades, newest first
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Page of trades; `side` is BUY/SELL from the caller's point of view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/trades:
    get:
      tags: [Trades]
      operationId: recentTrades
      summary: Recent trades of a stock (public tape)
      parameters:
        - { name: symbol, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Trade' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  responses:
    Validation:
      description: VALIDATION - bad input; `errors` maps field → message
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Role not allowed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: NOT_FOUND
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    OrderSide: { type: string, enum: [BUY, SELL] }
    OrderType: { type: string, enum: [LIMIT, MARKET] }
    OrderStatus: { type: string, enum: [PENDING, OPEN, PARTIALLY_FILLED, FILLED, CANCELLED, REJECTED] }
    OrderSource: { type: string, enum: [WEB, MARKET_MAKER] }
    Price:
      type: number
      multipleOf: 0.0001
      exclusiveMinimum: 0
      description: Up to 4 decimals; must be a multiple of the stock's tick size (default 0.01)
    Money:
      type: number
      multipleOf: 0.01

    PlaceOrderRequest:
      type: object
      required: [symbol, side, type, qty]
      properties:
        symbol: { type: string, maxLength: 10 }
        side: { $ref: '#/components/schemas/OrderSide' }
        type: { $ref: '#/components/schemas/OrderType' }
        price:
          allOf: [{ $ref: '#/components/schemas/Price' }]
          description: Required for LIMIT, must be absent for MARKET
        qty: { type: integer, format: int64, minimum: 1, maximum: 1000000000 }

    ModifyOrderRequest:
      type: object
      description: At least one of price, qty
      properties:
        price: { $ref: '#/components/schemas/Price' }
        qty: { type: integer, format: int64, minimum: 1, description: New total quantity (must exceed filledQty) }

    BuyOfferRequest:
      type: object
      required: [qty, maxPrice, seenVersion]
      properties:
        qty: { type: integer, format: int64, minimum: 1 }
        maxPrice: { allOf: [{ $ref: '#/components/schemas/Price' }], description: The price the buyer saw and accepts }
        seenVersion: { type: integer, format: int64, minimum: 0, description: The offer's version as shown to the buyer }

    Order:
      type: object
      required: [id, symbol, side, type, qty, remainingQty, filledQty, status, source, createdTime, updatedAt, version]
      properties:
        id: { type: integer, format: int64 }
        symbol: { type: string }
        side: { $ref: '#/components/schemas/OrderSide' }
        type: { $ref: '#/components/schemas/OrderType' }
        price: { type: [number, 'null'], description: null for MARKET }
        qty: { type: integer, format: int64 }
        remainingQty: { type: integer, format: int64 }
        filledQty: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/OrderStatus' }
        rejectReason: { type: [string, 'null'] }
        source: { $ref: '#/components/schemas/OrderSource' }
        createdTime: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }

    Offer:
      type: object
      description: An open SELL order as seen by buyers
      required: [orderId, symbol, sellerUserId, price, remainingQty, totalPrice, version, status, createdTime]
      properties:
        orderId: { type: integer, format: int64 }
        symbol: { type: string }
        sellerUserId: { type: integer, format: int64 }
        price: { $ref: '#/components/schemas/Price' }
        remainingQty: { type: integer, format: int64 }
        totalPrice: { type: number, description: price × remainingQty }
        version: { type: integer, format: int64, description: Send back as seenVersion when buying }
        status: { $ref: '#/components/schemas/OrderStatus' }
        createdTime: { type: string, format: date-time }

    Trade:
      type: object
      required: [id, symbol, buyOrderId, sellOrderId, buyerUserId, sellerUserId, qty, price, totalValue, executedAt]
      properties:
        id: { type: integer, format: int64 }
        symbol: { type: string }
        buyOrderId: { type: integer, format: int64 }
        sellOrderId: { type: integer, format: int64 }
        buyerUserId: { type: integer, format: int64 }
        sellerUserId: { type: integer, format: int64 }
        qty: { type: integer, format: int64 }
        price: { $ref: '#/components/schemas/Price' }
        totalValue: { $ref: '#/components/schemas/Money' }
        executedAt: { type: string, format: date-time }
        side: { type: [string, 'null'], enum: [BUY, SELL, null], description: From the caller's point of view (my trades only) }

    BuyOfferResponse:
      type: object
      required: [trade, order, offer]
      properties:
        trade: { $ref: '#/components/schemas/Trade' }
        order: { $ref: '#/components/schemas/Order', description: The buyer's (FILLED) order }
        offer: { $ref: '#/components/schemas/Offer', description: The offer after the purchase }

    BookLevel:
      type: object
      required: [price, qty, orders]
      properties:
        price: { $ref: '#/components/schemas/Price' }
        qty: { type: integer, format: int64, description: Sum of remaining quantities at this price }
        orders: { type: integer, format: int64, description: Number of orders at this price }

    Book:
      type: object
      required: [symbol, lastPrice, bids, asks, asOf]
      properties:
        symbol: { type: string }
        lastPrice: { $ref: '#/components/schemas/Price' }
        bestBid: { type: [number, 'null'] }
        bestAsk: { type: [number, 'null'] }
        bids: { type: array, items: { $ref: '#/components/schemas/BookLevel' }, description: Highest price first }
        asks: { type: array, items: { $ref: '#/components/schemas/BookLevel' }, description: Lowest price first }
        asOf: { type: string, format: date-time }

    OrderPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/Order' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    TradePage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/Trade' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: urn:exchange:trading:validation }
        title: { type: string, example: VALIDATION }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum: [VALIDATION, FORBIDDEN, NOT_FOUND, INVALID_STATE, PRICE_CHANGED, NO_LONGER_AVAILABLE, INSUFFICIENT_FUNDS, INSUFFICIENT_SHARES, UNAUTHORIZED, INTERNAL]
        errors:
          type: object
          additionalProperties: { type: string }
          description: VALIDATION only - field → message

    OfferConflict:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          required: [reason]
          properties:
            reason: { type: string, enum: [PRICE_CHANGED, NO_LONGER_AVAILABLE] }
            offer:
              oneOf:
                - { $ref: '#/components/schemas/Offer' }
                - { type: 'null' }
              description: The offer as it is now (null if the order no longer exists)
